name: Build Investor Tracker (Windows)

on:
  push:
    branches:
      - claude/investor-communications-app-LZC9D
    paths:
      - "investor-tracker/**"
      - ".github/workflows/build-investor-tracker.yml"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: investor-tracker
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: investor-tracker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and package (Windows installer)
        env:
          # Skip code signing — the .exe will work but Windows SmartScreen
          # will warn the first time it runs (click "More info" → "Run anyway").
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestorTracker-Windows-Installer
          path: investor-tracker/release/*.exe
          if-no-files-found: error
          retention-days: 30
