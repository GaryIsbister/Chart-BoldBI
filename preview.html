<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trade Flow Globe - Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="widget/trade-flow-map.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #06080f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #f5f7fa; }
    .layout { display: flex; flex-direction: column; height: 100vh; }
    .bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #0b1220; border-bottom: 1px solid #1c2740;
      font-size: 13px;
    }
    .bar h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .bar .spacer { flex: 1; }
    .bar label { display: inline-flex; align-items: center; gap: 6px; opacity: 0.85; }
    .bar select, .bar input[type=number] { background: #131a2c; color: #f5f7fa; border: 1px solid #26304a; border-radius: 3px; padding: 3px 6px; font-size: 12px; }
    .stage { flex: 1; position: relative; }
    #globe { position: absolute; inset: 0; }
    .hint { font-size: 11px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="bar">
      <h1>Trade Flow Globe</h1>
      <span class="hint">Preview using sample-trade-data.csv</span>
      <div class="spacer"></div>
      <label>Style
        <select id="styleSel">
          <option value="night" selected>Night</option>
          <option value="day">Day</option>
          <option value="topo">Topographic</option>
        </select>
      </label>
      <label><input type="checkbox" id="spinChk" checked /> Spin</label>
      <label><input type="checkbox" id="animChk" checked /> Animate</label>
      <label><input type="checkbox" id="iconChk" checked /> Icons</label>
      <label><input type="checkbox" id="legChk"  checked /> Legend</label>
    </div>
    <div class="stage"><div id="globe"></div></div>
  </div>

  <script>window.TradeFlowGlobeImageBase = "vendor";</script>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/globe.gl.min.js"></script>
  <script src="widget/country-centroids.js"></script>
  <script src="widget/commodity-categories.js"></script>
  <script src="widget/trade-flow-map.js"></script>

  <script>
    // Very small CSV parser, sufficient for the sample file (no embedded quotes).
    function parseCSV(text) {
      var lines = text.trim().split(/\r?\n/);
      var headers = lines[0].split(",");
      return lines.slice(1).map(function (line) {
        var cells = line.split(",");
        var row = {};
        headers.forEach(function (h, i) { row[h.trim()] = (cells[i] || "").trim(); });
        return row;
      });
    }

    function currentSettings() {
      return {
        globeStyle:  document.getElementById("styleSel").value,
        autoRotate:  document.getElementById("spinChk").checked,
        animateArcs: document.getElementById("animChk").checked,
        showIcons:   document.getElementById("iconChk").checked,
        showLegend:  document.getElementById("legChk").checked,
        rotateSpeed: 0.45,
        minArcWidth: 0.25,
        maxArcWidth: 3
      };
    }

    var widget = TradeFlowGlobeWidget.create();
    var container = document.getElementById("globe");

    fetch("sample/sample-trade-data.csv")
      .then(function (r) {
        if (!r.ok) throw new Error("Failed to load sample CSV (" + r.status + "). " +
                                    "Serve this page over HTTP, e.g. `python3 -m http.server`.");
        return r.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        widget.render(container, rows, currentSettings());

        ["styleSel","spinChk","animChk","iconChk","legChk"].forEach(function (id) {
          document.getElementById(id).addEventListener("change", function () {
            // Style change requires a full re-render; everything else can use update().
            if (id === "styleSel") {
              widget.destroy();
              widget = TradeFlowGlobeWidget.create();
              widget.render(container, rows, currentSettings());
            } else {
              widget.update(rows, currentSettings());
            }
          });
        });
      })
      .catch(function (err) {
        container.innerHTML = '<div style="padding:24px;color:#ffb3b3;font-size:13px;">' +
          err.message + '</div>';
      });
  </script>
</body>
</html>
